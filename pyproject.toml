[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "palavreco"
version = "1.0.0"
description = "Jogo de adivinhar a palavra de 5 letras em português, com interface tkinter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eduardo Lorenzo" }]
dependencies = []

[project.scripts]
palavreco = "palavreco.__main__:main"

[tool.setuptools]
packages = ["palavreco"]
